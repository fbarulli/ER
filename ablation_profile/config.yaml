# Profiling workload: real smoke_200 inputs, bounded dev cohort (10 pairs, 6 attributes).
# Mirrors config/attribute_ablation.yaml values; only scale knobs are bounded.
sample_pairs: 10
coverage: sampled
uniform_channels: false
seed: 1729
split: dev
batch_size: 64
accelerator: T4
attributes: [flavour, volume, pack type, sweetener, caffeine, juice content]
output_dir: ablation_profile/run
report_path: ablation_profile/run_report/report.json
retrieval_catalog: sampled
hnsw_m: 16
hnsw_ef_construction: 200
hnsw_ef_search: 100
retrieval_ks: [1, 5, 10]
graph_fields:
  volume: [numeric.volume_ml]
  count per unit: [numeric.pack]
  flavour: [attribute.flavor]
  carbonization: [attribute.carbonation]
  sweetener: [attribute.sweetener, attribute.sweetener_type, attribute.sweetening]
  pack type: [attribute.package_type]
slice_columns: []
