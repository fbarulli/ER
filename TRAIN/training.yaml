# ═══════════════════════════════════════════════════════════════════════════
# TRAIN/training.yaml — the TRAINING lane's OWN config (split-SSOT,
# 2026-09-08). Every knob below steers training only; shared data paths,
# file names, the column mapping, the seed and the model registry live in
# the root 00_config.yaml. Validated at load by lib.schemas.TrainingConfig
# via lib.common — a bad value crashes at import, never mid-run.
# ═══════════════════════════════════════════════════════════════════════════

# ── similarity column names (one per model-registry key) ────────────────────
sim_columns:
  minilm_l6: "sim_minilm_l6"
  multilingual_l12: "sim_multilingual_l12"
  deberta_v3_base: "sim_deberta_v3_base"

# ── masking augmentation ────────────────────────────────────────────────────
masking:
  enabled: true
  frac: 1.00          # fraction of positive anchors masked when enabled
  mask_prob: null     # null: per-pair extent drawn from mask_lo..mask_hi
  mask_lo: 0.20       # variable extent band, U(0.20, 0.35) per masked copy
  mask_hi: 0.35

# ── three-way gate (deterministic attribute gate; F01 audit round 2) ────────
# The gate's decision table, formerly signature defaults in
# data_pipe.three_way_gate (vol_tolerance=0.05 / raw_conf_threshold=0.85 /
# consistency_fallback_threshold=0.3). Same values, now config-owned:
#   vol_tolerance               ± relative volume overlap (250ml ≈ 500ml)
#   raw_conf_threshold          min volume/pack parse confidence to gate at all
#   consistency_fallback_threshold  below this consistency -> fallback, not hard_no
gate:
  vol_tolerance: 0.05
  raw_conf_threshold: 0.85
  consistency_fallback_threshold: 0.3

# ── split (component-aware; no pair ever straddles a boundary) ─────────────
# train  = 50% of connected components — the ONLY data the model trains on
# dev    = 25% — early-stopping target; weights are picked here, never trained on
# test   = 25% — HOLDOUT: the model NEVER trains on it, directly or via
#          early stopping. Every reported test metric (AUC, PR-AUC, F1)
#          comes from this set and nothing else.
split:
  mode: "holdout"
  train_fraction: 0.50
  dev_fraction: 0.25    # carved OUT OF THE TRAIN SIDE in cv mode; in holdout
                        # mode it is the q2 component quarter (q0+q1=train)
  test_fraction: 0.25
  fixed_threshold: 0.55  # the lane's operating cosine threshold (F1/P/R reported here)
  cv_folds: 5           # cv mode only

# ── training ────────────────────────────────────────────────────────────────
training:
  # loss: contrastive = OnlineContrastiveLoss over labeled (pos=1/neg=0)
  # hard pairs — per-batch hard-pair selection is native to the loss.
  # mnrl = MultipleNegativesRankingLoss (in-batch ranking); triplet = legacy.
  loss: "contrastive"
  contrastive_margin: 0.5     # OnlineContrastiveLoss margin (cosine distance)
  hard_positives: true        # volume-verified cross-country pairs join train
                              # when the second04 manifest exists (absent ->
                              # loud notice, lane runs gate-only)
  epochs: 10
  lr: 0.00002
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler: "linear"
  max_grad_norm: 1.0
  es_patience: 3
  es_threshold: 0.001
  # discriminative-LR groups: per-layer multiplicative decay bottom->top
  # (was an inline 0.9 default in TRAIN/training._discriminative_groups)
  layer_decay: 0.9
  # checkpoint retention (HF Trainer save_total_limit): best + last
  # (was an inline 2 in the STArgs build)
  save_total_limit: 2
  # cross-encoder rerank lane (07e): the stage-2 model's own encode cap
  # (was an inline 512 in TRAIN/rerank.CrossEncoder)
  rerank_max_length: 512
  # ── runtime knobs — no-fallback: every key must exist, nothing defaults
  #    inline at a call site (owner Q27) ──
  batch_size_cpu: 32          # finetune batch when on CPU
  batch_size_cuda: 128        # finetune batch when on GPU
  batch_size_embed: 256       # encode batch (zero-shot, plots, eval encoders)
  batch_size_eval: 256        # post-train eval encodes
  max_seq_length: 128         # every encoder call
  eval_steps_per_epoch: 4     # early-stop eval cadence
  dev_fraction: 0.15          # dev share OF THE TRAIN side (early stopping)
  max_triples: 5000           # triplet-lane cap (build_triplets reads this)
  n_target_mining: 20000      # in-band eval-pair mining target
  hardneg_k: 40               # cosine-ANN block size (mine_hard_negatives)

# ── pair-selection thresholds (owner's label semantics) ─────────────────────
# thresholds: the label rule; caps: eval-pair construction (were EDA/eda.yaml
# pairs: — migrated 2026-09-10 when the EDA dir was deleted).
# neg_oversample: random-negative bulk-draw multiplier (was inline 60 in
# lib/blocking.build_pairs).
pairs:
  proceed_sim_threshold: 0.80    # positives: proceed & sim>=0.80
  hardneg_sim_threshold: 0.80    # hard negatives: hard_no & sim>=0.80
  max_pos_per_group: 4           # eval-pair positives per multi-retailer group
  n_neg: 10000                   # eval negatives per build_pairs call
  neg_oversample: 60             # bulk-draw multiplier for valid negatives

# ── plotting (was EDA/eda.yaml plots: — every fig.savefig reads this) ────────
plots:
  dpi: 150                      # SSOT for every figure in the tree

# ── audits ────────────────────────────────────────────────────────────────────
# strip-audit sample size (was EDA/eda.yaml strip_audit_sample).
# blocking_audit knobs (audit round 2 F18, moved round 3): the blocking-
# feature audit's candidate-pair budget and greedy min-recall floor (were
# inline BUDGET = 5_000_000 / MIN_RECALL = 0.95 in TRAIN/blocking_audit.py).
audit:
  strip_audit_sample: 200
  blocking_budget: 5_000_000      # candidate pairs the classifier can afford
  blocking_min_recall: 0.95      # greedy forward-selection recall floor


# ── confusion / rerank bands (bi-encoder cosine) ────────────────────────────
bands:
  eval_mining: [0.35, 0.90]   # train_one_config's EVAL-pool mining band
  rerank_band: [0.50, 0.75]   # cross-encoder rerank slice

# ── rerank A/B decision rule (07e) — the quantitative "clearly improve" ────
# The hybrid SHIPS only when it beats the bi-encoder by at least this
# margin on PR-AUC OR F1 (dev-selected threshold, test-side absolutes —
# see the holdout discipline in TRAIN/rerank.py).
rerank:
  min_delta_pr_auc: 0.005
  min_delta_f1: 0.005

# ── HPO lanes (grid + TPE) — sweep spaces, trial budgets ────────────────────
# second07's fixed grid, verbatim (epochs x lr x warmup%), + the TPE
# search space and budgets. All were module-level literals in TRAIN/hpo.py
# / TRAIN/training.py — a config change can now steer every sweep.
hpo:
  grid:                       # each row: epochs / lr / warmup percent
    - {epochs: 1, lr: 2.0e-05, warmup: 0}
    - {epochs: 1, lr: 5.0e-05, warmup: 0}
    - {epochs: 1, lr: 1.0e-04, warmup: 0}
    - {epochs: 2, lr: 2.0e-05, warmup: 0}
    - {epochs: 2, lr: 5.0e-05, warmup: 0}
    - {epochs: 2, lr: 1.0e-04, warmup: 0}
    - {epochs: 4, lr: 2.0e-05, warmup: 0}
    - {epochs: 4, lr: 5.0e-05, warmup: 0}
    - {epochs: 4, lr: 1.0e-04, warmup: 0}
    - {epochs: 1, lr: 2.0e-05, warmup: 10}
    - {epochs: 2, lr: 5.0e-05, warmup: 10}
  quick:                      # --quick smoke: 3-config subset of the grid
    - {epochs: 1, lr: 2.0e-05, warmup: 0}
    - {epochs: 2, lr: 5.0e-05, warmup: 0}
    - {epochs: 2, lr: 5.0e-05, warmup: 10}
  tpe_space:                  # optuna suggest ranges per knob
    epochs: [1, 4]           # int
    lr: [1.0e-05, 1.0e-04]    # float, log-uniform
    warmup_ratio: [0.0, 0.1]  # float
    weight_decay: [0.0, 0.1]  # float
  n_trials: 20                # default TPE trial budget (was --n-trials 20)
  n_jobs: 1                   # default parallel workers (was --n-jobs 1)

# ── ablation sweep (run_all step 4 / colab smoke) ──────────────────────────
# The 07-series axes run_all sweeps: payload variants (07c, 'full' is
# step 3 itself so it is skipped), train-frac curve (07d), the smoke
# sample size, and the 07e rerank cross-encoder. All were inline
# literals in run_all.py / colab_backend.py.
sweep:
  payload_variants: ["title_only"]   # 07c variants beyond 'full'
  train_fracs: [0.25, 0.50, 0.75]    # 07d data-scaling curve
  smoke_sample: 1000                  # chain-check sample size (--sample)
  sweep_sample: 2000                  # step-2 smoke sweep size
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"  # 07e stage-2

# ── mining band for in-batch negatives ───────────────────────────────────────
mining:
  band: "0.45-0.80"           # "lo-hi" — parsed + validated by MiningSpec
  k: 40                      # ANN candidates per block (mine_hard_negatives)
