[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euromonitor-reconciliation"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
er-colab = "cli.colab:main"
er-train = "training.train:main"
er-rand-match = "training.rand_matching:main"
er-ann-index = "training.build_ann_index:main"
er-generate-rand-truth = "training.generate_rand_truth:main"
er-sample-balanced-pairs = "training.sample_balanced_pairs:main"
er-sample-deduped-dataset = "training.sample_deduped_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]
