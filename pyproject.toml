[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euromonitor-reconciliation"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
# Optional diagnostics only; Atlas is never required for training or inference.
atlas = ["nomic"]

[project.scripts]
er-colab = "cli.colab:main"
er-kaggle = "cli.kaggle_lane:main"
er-hpo = "cli.laya_hpo:main"
er-train = "training.train:main"
er-prepare = "training.prepare_all:main"
er-embeddings = "training.prepare_embeddings:main"
er-rand-match = "training.rand_matching:main"
er-ann-index = "training.build_ann_index:main"
er-generate-rand-truth = "training.generate_rand_truth:main"


[tool.setuptools.packages.find]
where = ["src"]
