[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euromonitor-reconciliation"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
er-colab = "euromonitor.cli.colab:main"
er-train = "euromonitor.training.train:main"

[tool.setuptools.packages.find]
where = ["src"]
