# ═══════════════════════════════════════════════════════════════════════════
# config/training.yaml — the TRAINING lane's OWN config (split-SSOT,
# 2026-09-08). Every knob below steers training only; shared data paths,
# file names, the column mapping, the seed and the model registry live in
# the root config/paths.yaml. Validated at load by lib.schemas.TrainingConfig
# via lib.common — a bad value crashes at import, never mid-run.
# ═══════════════════════════════════════════════════════════════════════════

# ── similarity column names (one per model-registry key) ────────────────────
sim_columns:
  minilm_l6: "sim_minilm_l6"
  multilingual_l12: "sim_multilingual_l12"
  deberta_v3_base: "sim_deberta_v3_base"

# ── masking augmentation ────────────────────────────────────────────────────
masking:
  enabled: true
  profile: baseline
  frac: 1.00          # fraction of positive anchors masked when enabled
  mask_hard_negatives: true  # enable dynamic masking on label-0 training pairs
  hard_negative_frac: 0.30   # mask_frac_negatives: only 30% of label-0 presentations
  mask_prob: null     # null: positive extent drawn from mask_lo..mask_hi
  mask_lo: 0.20       # variable extent band, U(0.20, 0.30) per masked copy
  mask_hi: 0.30
  hard_negative_mask_prob: null  # null: negative extent drawn from its band
  hard_negative_mask_lo: 0.10  # extent per masked presentation, not mask frequency
  hard_negative_mask_hi: 0.20
  track_visibility: true      # persist per-copy realized mask percentages
  track_per_epoch: true       # persist dynamic hard-negative mask percentages

masking_profiles:
  baseline: {}
  matched_positive_negative:
    mask_lo: 0.40
    mask_hi: 0.60
    # Keep the experiment's positive masking band, but make negative
    # masking less frequent and much less destructive per presentation.
    hard_negative_frac: 0.30
    hard_negative_mask_lo: 0.10
    hard_negative_mask_hi: 0.20
  lower_negative_masking:
    # Comparison arm: lower frequency and lower per-presentation extent.
    hard_negative_frac: 0.15
    hard_negative_mask_lo: 0.05
    hard_negative_mask_hi: 0.10
  minimal_negative_masking:
    # Third arm: substantially lower frequency and extent than the comparison
    # arm, while retaining a small negative-mask signal.
    hard_negative_frac: 0.05
    hard_negative_mask_lo: 0.02
    hard_negative_mask_hi: 0.05

# Optional remote mirror. Credentials stay in WANDB_API_KEY, never here.
# Without that environment variable, runs remain local and MLflow is intact.
tracking:
  wandb:
    project: "e-r"
    mode: "online"

# ── Colab checkout/runtime ─────────────────────────────────────────────────
# The launcher clones this public training branch instead of uploading a
# local working tree or data snapshot.
colab:
  repository: "https://github.com/fbarulli/ER.git"
  branch: "training"
  git_remote_name: "ER"
  remote_root: "/content/EuromonitoR"
  session: "my-highram-session"
  gpu: "T4"
  # Training workers consume immutable bundles prepared locally.  Keep all
  # payload, pair, masking, country, and calibration construction off Colab.
  remote_data_prep: false
  training_dataset_csv: "artifacts/data/dataset_deduped_train_minus_3000.csv"
  hpo_mode: "sequential"
  hpo_workers: 2
  train_workers: 6
  smoke_workers: 1
  mixed_train_workers: 1
  mixed_sims_workers: 1
  mixed_mining_profile: "masking_only"
  sims_model: "minilm_l6"
  log_poll_seconds: 2
  probe_timeout_seconds: 600
  probe_retries: 4
  probe_retry_backoff_seconds: 5
  artifact_repo_id: "fbarulli/e-r-training-artifacts"
  artifact_repo_private: true
  # Mask-effect scoring is a local post-run analysis over the downloaded
  # checkpoint/results; do not spend remote GPU time on it during training.
  mask_effect_after_train: false
  smoke_epochs: 1
  dvc_remote_url: "https://dagshub.com/fbarulli/ER.dvc"
  dagshub_repo: "fbarulli/ER"
  worker_timeout_seconds: 14400
  result_download_timeout_seconds: 3600
  result_download_heartbeat_seconds: 15
  result_archive_name: "result_bundle.tar.gz"
  result_manifest_name: "result_bundle_manifest.json"
  result_download_excluded_dirs:
    - ".dvc-cache"
    - ".dvc-site-cache"
    - "_checkpoint_upload_staging"
    - "_checkpoints"
  worker_monitor_seconds: 15
  # One lane-level DVC publisher is separate from trainer/HPO workers.
  dvc_workers: 1
  # DVC's internal content-transfer jobs. This controls parallel object
  # transfers inside one DVC command; it is not another trainer process.
  dvc_jobs: 4
  result_events_file: "result_events.jsonl"
  dvc_events_file: "dvc_events.jsonl"
  dvc_push_retries: 5
  dvc_push_backoff_seconds: 15
  validation_inference:
    enabled: true
    source_csv: "artifacts/data/dataset_deduped.csv"
    input_csv: "artifacts/data/dataset_deduped_sample_3000.csv"
    output_dir: "validation_inference"
    batch_size: 128
    device: "cuda"
    error_threshold: 0.787
    thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]

# ── three-way gate (deterministic attribute gate; F01 audit round 2) ────────
# The gate's decision table, formerly signature defaults in
# data_pipe.three_way_gate (vol_tolerance=0.05 / raw_conf_threshold=0.85 /
# consistency_fallback_threshold=0.3). Same values, now config-owned:
#   vol_tolerance               ± relative volume overlap (250ml ≈ 500ml)
#   raw_conf_threshold          min volume/pack parse confidence to gate at all
#   consistency_fallback_threshold  below this consistency -> fallback, not hard_no
gate:
  vol_tolerance: 0.05
  raw_conf_threshold: 0.85
  consistency_fallback_threshold: 0.3

# ── split (component-aware; no pair ever straddles a boundary) ─────────────
# train  = 50% of connected components — the ONLY data the model trains on
# dev    = 25% — early-stopping/calibration source; calibration is a GTIN-disjoint
#          subset reserved from DEV and is not used for early stopping
# test   = 25% — HOLDOUT: the model NEVER trains on it, directly or via
#          early stopping. Every reported test metric (AUC, PR-AUC, F1)
#          comes from this set and nothing else.
split:
  mode: "holdout"
  train_fraction: 0.50
  dev_fraction: 0.25    # holdout q2 component quarter (q0+q1=train); CV
                        # must declare 0.0 here because training.dev_fraction
                        # owns the per-fold early-stopping carve
  calibration_dev_fraction: 0.50  # component-safe share of DEV reserved for Rand threshold
                                  # calibration; at most half (config load rejects > 0.5)
  calibration_seed_offset: 17     # deterministic per-fold calibration carve offset
  holdout_component_folds: 4      # q0+q1 train, q2 dev, q3 test — the ONLY arity the
                                  # 50/25/25 contract supports (schema-pinned Literal[4]);
                                  # folds.holdout_split derives the roles from it and
                                  # requires dev_fraction == test_fraction == 1/4
  test_fraction: 0.25   # holdout q3 component quarter; CV must declare 0.0
  fixed_threshold: 0.55  # the lane's operating cosine threshold (F1/P/R reported here)
  cv_folds: 5           # cv mode only

# ── zero-shot evaluation protocol (src/training/evaluate_models.py) ────────────────
# HOLDOUT DISCIPLINE for the zero-shot lane (self-fit leak closed 2026-09-14):
# labeled pairs are split into DEV/TEST halves by CONNECTED COMPONENT
# (component_folds, same seed SSOT as the training lane). The Youden
# threshold is FIT ON DEV and applied verbatim to TEST — never fitted on
# the scores it rates. Every reported metric is test-side; the CSV keeps
# youden_thr_test_descriptive as the leak diagnostic only.
evaluation:
  component_split_k: 2   # component folds over the labeled-pair barcode graph
  dev_fold: 0             # fold index used as DEV  (threshold-fit half)
  test_fold: 1            # fold index used as TEST (reported half)
  retrieval_ks: [1, 5, 10]  # persisted Precision@K / Recall@K cutoffs
  robust_validation:
    enabled: true
    n_folds: 5             # repeated held-out folds over SKU/GTIN components
    repeats: 3             # independent seeded assignments, 15 scored folds total
    seed: 42
    min_slice_size: 25     # suppress unstable brand/category slices
    dimensions: [brand, category, attribute]
    operating_thresholds:
      balanced_review: 0.787
      high_precision: 0.85
  uniformity:
    enabled: true
    sample_pairs: 100
    seed: 42
    checkpoint_scope: "final"

# Shared unrelated-pair collapse monitoring and HPO penalty contract.
collapse_guardrail:
  enabled: true
  profile: threshold_80
  unrelated_pairs: 100
  seed: 42
  median_penalty_start: 0.50
  p90_penalty_start: 0.70
  cosine_std_floor: 0.05
  penalty_weight: 1.0
  reject_median: 0.80
  max_token_frequency: 0.05
  operating_threshold: 0.80
  crossing_rate_ceiling: 0.02

collapse_guardrail_profiles:
  threshold_80:
    operating_threshold: 0.80
  threshold_65:
    operating_threshold: 0.65

# ── final Rand Index matching lane ─────────────────────────────────────────
# Runtime input files are required CLI arguments; all matcher behavior and
# output locations live here so the final submission has one SSOT.
rand_matching:
  output_dir: "submission"
  truth_splits:
    # One representative SKU for each selected canonical identity.  The two
    # files are disjoint in both SKU_ID and true_item_id, so they can be
    # supplied directly to er-rand-match.
    output_dir: "results/rand_truth"
    calibration_output: "calibration_truth.csv"
    holdout_output: "holdout_truth.csv"
    # All canonical truths that have a representative deduplicated SKU.
    # There are currently 12,986; the remaining 264 canonical records have
    # no source SKU and therefore cannot be evaluated by the matcher.
    sample_size: 12986
    calibration_size: 8657
    calibration_folds: 3
    seed: 42
  stratum_sweep:
    # A non-degenerate GTIN-ablation fixture: two source SKUs per canonical
    # truth, with complete, mismatched, and missing source GTIN scenarios.
    output_dir: "results/rand_truth"
    output: "gtin_stratum_sweep.csv"
    identities_per_status: 600
    skus_per_identity: 2
    calibration_folds: 3
    seed: 42
  outputs:
    submission: "SKU_ITEM_submission.csv"
    diagnostics: "SKU_ITEM_submission_diagnostics.csv"
    threshold_selection_by_fold: "threshold_selection_by_fold.csv"
    threshold_sensitivity_by_gtin_status: "threshold_sensitivity_by_gtin_status.csv"
    threshold_sensitivity_plot: "threshold_sensitivity_by_gtin_status.png"
    threshold_comparison: "threshold_comparison.csv"
    plateau_diagnostic: "plateau_diagnostic.json"
    holdout_metrics: "holdout_metrics.csv"
    calibration_diagnostics: "calibration_diagnostics.csv"
    holdout_diagnostics: "holdout_diagnostics.csv"
    provenance: "submission_provenance.json"
  top_k: 20
  batch_size: 128
  # The sensitivity surface must reach the lower one_missing/different
  # operating range; exact-GTIN remains locked independently of this grid.
  threshold_min: 0.60
  threshold_max: 0.98
  threshold_step: 0.01
  threshold_by_gtin_status:
    both_equal: 0.80
    different: 0.80
    one_missing: 0.60
    both_missing: 0.80
  brand_conflict_veto: true
  target_recall: 0.90
  threshold_tie_break:
    - "rand_index"
    - "fewest_unmatched_skus"
    - "lowest_threshold"
  threshold_reconciliation_scope: "final_assignment_gtin_and_attribute_gates"
  threshold_min_fold_support: 3
  calibration_proxy_source: "dev_component_safe_split+labeled_pairs_gate_positive_different"
  # Deterministic source rule for the labeled_pairs cross-GTIN calibration
  # stratum: lowest eligible source-row index, then lexicographically smallest
  # target GTIN. The Pydantic Literal makes this policy fail loudly if changed
  # without an implementation update.
  calibration_different_gtin_selection: "lowest_source_row_lexicographic_target"
  plateau_tolerance: 0.005
  plateau_min_points: 3
  # SSOT for the unmatched-SKU ITEM_ID prefix (RM8). rand_matching.py's four
  # hardcoded "UNMATCHED_" sites must read this key — REQUIRED by
  # RandMatchingSpec (extra="forbid"), so a missing/mismatched value fails
  # every lane at config load, and the lookup vs column-name mismatch on
  # fit_threshold_at_90pct_recall needs NO config key (the f-string
  # f"fit_threshold_at_{target_recall:.0%}_recall" is the fix).
  unmatched_prefix: "UNMATCHED_"

# ── training ────────────────────────────────────────────────────────────────
training:
  # Registry key used when --model is omitted from the training entry point.
  base_model: "minilm_l6"
  architecture: "two_tower"  # default: shared-weight SKU/canonical retrieval towers
  uniformity_regularization:
    enabled: true
    weight: 0.05
    temperature: 2.0
    min_batch_size: 4
  late_epoch_lr_decay:
    enabled: true
    start_epoch_fraction: 0.50
    multiplier: 0.50
  structured_features:
    enabled: true
    append_to_text: true  # intentional text channel for normalized volume/pack
    feed_to_loss: true    # intentional second structured channel in the loss
    embedding_weight: 0.35
    volume_scale_ml: 10000.0
    pack_scale: 100.0
    max_set_size: 8
  # loss: contrastive = OnlineContrastiveLoss over labeled (pos=1/neg=0)
  # hard pairs — per-batch hard-pair selection is native to the loss.
  # mnrl = MultipleNegativesRankingLoss (in-batch ranking); triplet = legacy.
  loss: "contrastive"
  contrastive_margin: 0.3     # OnlineContrastiveLoss margin (cosine distance); target negative cosine < 0.8
  hard_positives: true        # generate volume-verified cross-country pairs
                              # and join them to the training positives
  epochs: 10
  lr: 0.00002
  warmup_ratio: 0.05
  weight_decay: 0.01          # conservative AdamW regularization
  projection_dropout: 0.10    # applied after SentenceTransformer pooling
  label_smoothing: 0.05       # binary smoothing for contrastive loss only
  random_easy_negatives:
    enabled: true
    ratio_to_hard: 1.0        # retain every hard negative, then add 1 easy per hard
    candidate_pool_size: 10000
  lr_scheduler: "linear"
  max_grad_norm: 1.0
  es_patience: 3
  es_threshold: 0.001
  # discriminative-LR groups: per-layer multiplicative decay bottom->top
  # (was an inline 0.9 default in src/training/training._discriminative_groups)
  layer_decay: 0.9
  # checkpoint retention (HF Trainer save_total_limit): best + last
  # (was an inline 2 in the STArgs build)
  save_total_limit: 2
  # cross-encoder rerank lane (07e): the stage-2 model's own encode cap
  # (was an inline 512 in src/training/rerank.CrossEncoder)
  rerank_max_length: 512
  # ── runtime knobs — no-fallback: every key must exist, nothing defaults
  #    inline at a call site (owner Q27) ──
  batch_size_cpu: 32          # finetune batch when on CPU
  # Conservative shared batch sizes for the 14.6-GB T4 across all three
  # swept backbones (MiniLM, multilingual L12, and DeBERTa-v3-base).
  batch_size_cuda: 64         # finetune batch when on GPU
  batch_size_embed: 64        # encode batch (zero-shot, plots, eval encoders)
  batch_size_eval: 64         # post-train eval encodes
  max_seq_length: 128         # every encoder call
  eval_steps_per_epoch: 4     # early-stop eval cadence
  dev_fraction: 0.15          # dev share OF THE TRAIN side (early stopping)
  max_triples: 5000           # triplet-lane cap (build_triplets reads this)
  track_datapoint_usage: true # per-presentation population/epoch verifier

# ── pair-selection thresholds (owner's label semantics) ─────────────────────
# thresholds: the label rule; caps: eval-pair construction (were EDA/eda.yaml
# pairs: — migrated 2026-09-10 when the EDA dir was deleted).
# neg_oversample: random-negative bulk-draw multiplier (was inline 60 in
# src/core/blocking.build_pairs).
pairs:
  proceed_sim_threshold: 0.80    # positives: proceed & sim>=0.80
  hardneg_sim_threshold: 0.80    # hard negatives: hard_no & sim>=0.80
  max_pos_per_group: 4           # eval-pair positives per multi-retailer group
  n_neg: 10000                   # eval negatives per build_pairs call
  neg_oversample: 60             # bulk-draw multiplier for valid negatives
  balance_train_classes: true    # next training run: train negatives match all positives

# ── plotting (was EDA/eda.yaml plots: — every fig.savefig reads this) ────────
plots:
  dpi: 150                      # SSOT for every figure in the tree

# ── audits ────────────────────────────────────────────────────────────────────
# strip-audit sample size (was EDA/eda.yaml strip_audit_sample).
# blocking_audit knobs (audit round 2 F18, moved round 3): the blocking-
# feature audit's candidate-pair budget and greedy min-recall floor (were
# inline BUDGET = 5_000_000 / MIN_RECALL = 0.95 in src/training/blocking_audit.py).
# strip_ladder_bands (SSOT move, this round): the strip-audit similarity
# ladder's Jaccard band edges — were an inline literal list in
# src/training/strip_audit.py (~:186). Same values, new home; read via
# lib.common.strip_ladder_bands().
# The four manifest_* / source_* knobs below (SILENT_DROPS task 2) feed the
# silent-drop guardrail layer: per-stage manifests, the raw-export census,
# and the source-drift gate that enforces it. Defaults live in
# AuditSpec (src/core/schemas.py) and are mirrored here explicitly so the SSOT
# stays self-documenting; tasks 3+ consume them via training_cfg().audit.
audit:
  strip_audit_sample: 200
  strip_ladder_bands: [[0.0, 0.2], [0.2, 0.4], [0.4, 0.6], [0.6, 0.8], [0.8, 1.01]]
  blocking_budget: 5_000_000      # candidate pairs the classifier can afford
  blocking_min_recall: 0.95      # greedy forward-selection recall floor
  manifest_dir: "results/manifests"   # per-stage <stage>.json, written LAST;
                               # presence w/ status "complete" = stage ran
  source_export_expected_rows: 71_623 # approved dataset.csv census (drift gate)
  source_drift_threshold_pct: 0.0     # allowed row-count drift; 0.0 = exact
  source_export_expected_sha256: "539c247292de41d065a7e1b472a845cc122f95cee9087cf567099cf312fab88c" # approved source bytes
  manifest_stages:                    # stages that MUST produce a manifest,
    - "dedupe"                        # in pipeline order (an orchestrator lane
    - "data_prep"                     # may append its own later)
    - "labeled_pairs"
    - "evaluate_models"
    - "zero_shot_sims"


# ── confusion / rerank bands (bi-encoder cosine) ────────────────────────────
bands:
  eval_mining: [0.35, 0.90]   # train_one_config's EVAL-pool mining band
  rerank_band: [0.50, 0.75]   # cross-encoder rerank slice

# ── rerank A/B decision rule (07e) — the quantitative "clearly improve" ────
# The hybrid SHIPS only when it beats the bi-encoder by at least this
# margin on PR-AUC OR F1 (dev-selected threshold, test-side absolutes —
# see the holdout discipline in src/training/rerank.py).
rerank:
  min_delta_pr_auc: 0.005
  min_delta_f1: 0.005

# ── HPO lanes (grid + TPE) — sweep spaces, trial budgets ────────────────────
# second07's fixed grid, verbatim (epochs x lr x warmup%), + the TPE
# search space and budgets. All were module-level literals in src/training/hpo.py
# / src/training/training.py — a config change can now steer every sweep.
hpo:
  # Backbone registry keys swept in round-robin order. Values resolve through
  # config/paths.yaml models; the launcher never embeds model identifiers.
  models: ["minilm_l6"]
  grid:                       # each row: epochs / lr / warmup percent
    - {epochs: 1, lr: 2.0e-05, warmup: 0}
    - {epochs: 1, lr: 5.0e-05, warmup: 0}
    - {epochs: 1, lr: 1.0e-04, warmup: 0}
    - {epochs: 2, lr: 2.0e-05, warmup: 0}
    - {epochs: 2, lr: 5.0e-05, warmup: 0}
    - {epochs: 2, lr: 1.0e-04, warmup: 0}
    - {epochs: 4, lr: 2.0e-05, warmup: 0}
    - {epochs: 4, lr: 5.0e-05, warmup: 0}
    - {epochs: 4, lr: 1.0e-04, warmup: 0}
    - {epochs: 1, lr: 2.0e-05, warmup: 10}
    - {epochs: 2, lr: 5.0e-05, warmup: 10}
  quick:                      # --quick smoke: 3-config subset of the grid
    - {epochs: 1, lr: 2.0e-05, warmup: 0}
    - {epochs: 2, lr: 5.0e-05, warmup: 0}
    - {epochs: 2, lr: 5.0e-05, warmup: 10}
  tpe_space:                  # optuna suggest ranges per knob
    epochs: [10, 10]         # fixed: every HPO trial runs 10 epochs
    lr: [1.0e-05, 1.0e-04]    # float, log-uniform
    warmup_ratio: [0.0, 0.1]  # float
    weight_decay: [0.0, 0.1]  # float
    negative_mask_frac: [0.0, 0.5]  # hard-negative masking; positive masking stays masking.frac
    uniformity_weight: [0.0, 0.05]  # trial-level anti-collapse regularizer
  n_trials: 20                # default TPE trial budget (was --n-trials 20)
  n_jobs: 2                   # default parallel HPO trial workers
  persistence: "dvc"         # DVC-backed HPO snapshots
  calibration_folds: 3        # canonical-disjoint folds for the trial proxy
  # ── selection protocol (test-leak fix, 2026-09-12) ─────────────────────
  # WHICH signal a sweep ranks configs on, per split mode. Holdout sweeps
  # train q0+q1, early-stop + select on the dev quarter q2's component-safe
  # calibration Rand proxy and NEVER compute a per-config test metric — the
  # test quarter is read exactly once, by the main train lane. CV uses the
  # same calibration Rand schema on its validation-side folds.
  objective:
    holdout: rand_index_proxy
    cv: rand_index_proxy
  # selection-mode folds skip the test-side eval block + pair dump and
  # record test_eval=skipped_selection_mode instead. MUST stay true:
  # computing a per-config test metric re-opens the leak this closed.
  selection_skip_test_eval: true

# ── ablation sweep (07-series axes / colab smoke) ──────────────────────────
# The 07-series axes: payload variants (07c, 'full' is the main holdout lane
# itself so it is skipped), train-frac curve (07d), the smoke sample size,
# and the 07e rerank cross-encoder. src/cli/colab.py derives its
# smoke-sample, train-frac and rerank defaults from this block. All were
# inline literals in the deleted run_all.py orchestrator / colab_backend.py.
sweep:
  payload_variants: ["title_only"]   # 07c variants beyond 'full'
  train_fracs: [0.25, 0.50, 0.75]    # 07d data-scaling curve
  smoke_sample: 100                   # chain-check sample size (--sample)
  sweep_sample: 2000                  # step-2 smoke sweep size
  rerank_model: "rerank_minilm_l6"  # local registry key; DVC-shipped bundle

# ── mining band for in-batch negatives ───────────────────────────────────────
mining:
  # Each miner has an independent switch and parameter set. Masking is
  # configured separately above.
  ann:
    # Safe default: ANN mining requires an explicit mining_enabled profile.
    # masking_only and ordinary training runs must not turn it on implicitly.
    enabled: false
    target: 20000             # maximum generic hard/eval pairs per lane
    band: "0.45-0.80"        # cosine band for ANN candidates
    band_mode: "adaptive_quantile" # fixed | adaptive_quantile | intersection
    k: 40                     # top ANN candidates per row
    chunk_size: 2048          # rows per cosine-matrix chunk (OOM control)
    exclude_conflicting: true # drop known conflicting-barcode label errors
    refresh_enabled: false    # ANN stays off unless an explicit experiment enables it
    refresh_every_epochs: 1   # checkpoint refresh cadence in completed epochs
    candidate_multiplier: 4    # broad candidates retained for score calibration
    score_quantiles: "0.10-0.90" # fine-tuned candidate quantiles inside band
    max_per_canonical: 5      # endpoint diversity cap per canonical/barcode
    max_per_brand: 100        # endpoint diversity cap per brand
  attribute_conflict:
    enabled: true
    target: 12000             # maximum volume/pack/flavor-conflict pairs
    band: "0.45-0.95"        # cosine band for same-brand/category conflicts

# Named concurrent-run selectors. They toggle methods only; all miner knobs
# remain in mining.ann / mining.attribute_conflict above.
mining_profiles:
  mining_enabled:
    ann_enabled: true
    attribute_conflict_enabled: true
  masking_only:
    ann_enabled: false
    attribute_conflict_enabled: false

# ── NER lane ───────────────────────────────────────────────────────────────
# NER is a training consumer, so it shares this configuration contract rather
# than carrying a module-specific config file. Paths are resolved by
# core.common.ner_config(); no NER module infers a config location.
ner:
  base_dir: "."
  results_dir: "results"
  columns: &ner_columns
    sku_name_eng: "sku_name_eng"
    brand: "brand"
    sku_name_clean: "sku_name_clean"
    namebrandmatch: "namebrandmatch"
  data_prep:
    input_csv: "dataset.csv"
    output_csv: "${results_dir}/dataset_model_input.csv"
    columns: *ner_columns
  semantic_training:
    INPUT_CSV: "${results_dir}/dataset_model_input.csv"
    MODEL_NAME: "ner_semantic_base"
    OUTPUT_DIR: "${results_dir}/model"
    EPOCHS: 3
    BATCH_SIZE: 32
    LEARNING_RATE: 2.0e-5
    WARMUP_STEPS: 100
    WEIGHT_DECAY: 0.01
    TRAIN_FRAC: 0.50
    VALIDATION_FRAC: 0.25
    HOLDOUT_FRAC: 0.25
    NEGATIVE_SAMPLING_RATIO: 1.0
    EVAL_STEPS: 500
    SAVE_STEPS: 1000
    SEED: 42
    COLUMNS: *ner_columns
    HF_REPO_ID: "fbarulli/euromonitor-semantic-model"
  semantic_evaluation:
    model_dir: "${results_dir}/model"
    input_csv: "${results_dir}/dataset_model_input.csv"
    hf_repo_id: "fbarulli/euromonitor-semantic-model"
    sample_size: 100
    random_state: 42
    output_csv: "${results_dir}/semantic_similarity_top.csv"
    metrics_csv: "${results_dir}/metrics.csv"
    fp_csv: "${results_dir}/false_positives.csv"
    fn_csv: "${results_dir}/false_negatives.csv"
    predictions_csv: "${results_dir}/predictions.csv"
    top_n_fp_fn: 100
    seed: 42
    columns:
      <<: *ner_columns
      similarity: "similarity"
      predicted: "predicted"
      semantic_similarity: "semantic_similarity"
    encode_params:
      normalize_embeddings: true
      show_progress_bar: true
  ner_training:
    input_jsonl: "${results_dir}/ner_dataset.jsonl"
    output_dir: "${results_dir}/ner_model"
    model_name: "ner_transformer_base"
    epochs: 10
    batch_size: 32
    learning_rate: 2.0e-5
    dropout: 0.2
    train_frac: 0.50
    validation_frac: 0.25
    holdout_frac: 0.25
    seed: 42
    label: "BRAND"
  colab:
    session: "SemanticSim"
    gpu: "T4"
    remote_root: "/content/SemanticSim"
  huggingface:
    ner_repo_id: "fbarulli/e-r"
    token_file: ".env"
