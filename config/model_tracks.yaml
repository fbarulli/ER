# One Colab runtime, one control channel, all three prepared tracks.
setup_dir: data/track_setup
text_bundle: data/track_setup/text_prepared.pkl.gz
text_model: minilm_l6
epochs: 10
device: cuda
input_archive_format: tar.zst
result_archive_format: tar.zst
schedule: parallel
max_parallel: 3
gpu_parallel_backend: mps
# GPU execution overrides are frozen into each packaged graph configuration.
gpu_optimizer_backend: cuda_fused
gpu_graph_aggregation_backend: cuda_segment
# Populate with measured per-worker peaks before enabling GPU overlap.
# MEASURED 2026-10-07 on the T4 (run 1007T224803008250Z, 3 workers over MPS):
# device-wide peak 1.06 GiB of 15.0 GiB, median 0.36 GiB, 125 samples.
# Left EMPTY on purpose: the profiler attributes the whole device and cannot
# split MPS clients, so a per-worker number cannot be derived from it. Fill this
# in only from a run that reports per-worker peaks.
memory_reservations_gb: {}
gpu_headroom_gb: 2.0
# Report the held-out test half. Selection stays on dev (early stopping and
# threshold fitting); this only turns on the post-selection test report, which
# was the one thing missing from the 2026-10-07 run.
report_test: true
publish_git: false
publish_dvc: false
profiling: true

post_training_ablation: true
ablation_config: config/attribute_ablation.yaml
