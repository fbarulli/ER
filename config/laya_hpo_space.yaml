# config/laya_hpo_space.yaml — the laya fine-tune HPO search space (SSOT).
#
# The SINGLE source of truth for the laya Optuna/TPE lane (`cli.laya_hpo`).
# No bound, choice, type or target appears in code: `sample_dials` dispatches
# purely from the `dials:` block below, and `apply_dials` routes each sampled
# value to the channel named by `target`.
#
#   target: config   -> a `laya.train.TrainConfig` kwarg (the staged
#                       FINETUNE_CONFIG block; `finetune_config()`).
#   target: control  -> a staged training-control kwarg (the FINETUNE_CONTROL
#                       block `finetune_control()`; never a TrainConfig kwarg).
#
# Every `dials.<name>` MUST name a `core.laya_config.FinetuneSpec` field once
# the laya training-dials branch lands; `validate_space` asserts it TODAY, so a
# dial rename in the dials branch fails the loader loudly instead of silently
# sampling a key no trainer reads.
#
# This file carries BOUNDS/CHOICES only — NEVER a secret. The shared
# PostgreSQL Optuna URL lives exclusively in the runtime secret store
# (`OPTUNA_STORAGE_URL`) and is injected into the staged kernel, never here.

space_version: 1

# The shared-study identity (the model boundary; kept distinct from the
# generation boundary, which is runtime environment).
model_key: laya

# TPE budget/sampler. `n_trials` is the CLUSTER budget for the generation
# (shared across every worker and Kaggle session on this study name); each
# worker splits the remaining budget so sessions do not multiply it.
n_trials: 24
n_jobs: 2          # one GPU worker per visible T4 (2xT4 in a Kaggle session)
seed: 1729

# The objective contract (rank trials on DEV only; never touch test).
objective:
  direction: maximize
  primary: dev_accuracy
  secondary: dev_loss      # recorded as a trial user attr, never the ranker
  forbidden: test          # the held-out split is NEVER an HPO signal

# Per-trial torch.profiler harness. `enabled: false` turns profiling OFF
# (the lane then trains unprofiled). The bounded schedule samples only a SLICE
# of each trial (wait/warmup cycles are discarded; `active` cycles per
# `repeat` are captured), advanced once per optimizer step. The chrome trace
# lands at <trial_dir>/profiler/trial_<n>.json and the top-op table
# (`top_ops` rows) goes to stdout + wandb. CPU-only sessions auto-disable.
profiler:
  enabled: true
  wait: 1
  warmup: 1
  active: 3
  repeat: 1
  top_ops: 15

# ── HPO option set (every option is selected here; no code literals) ────────
# See training/laya_hpo_options.py: one class per responsibility, a name->
# builder registry per family, assembled by `build_option_set`.
options:
  # A) trial parallelism
  parallelism: slots          # slots | ddp
  slots_per_gpu: 1            # slots mode: worker PROCESSES per GPU
  max_concurrent_trials: 2    # ceiling across all GPUs/slots
  mps: false                  # CUDA Multi-Process Service (slots mode)
  ddp:
    nproc_per_node: 2         # ddp mode: ranks per trial
    backend: nccl
    master_port: 29500
  resources:                  # per-worker CPU/CUDA fairness caps
    threads_per_worker: 1     # thread/core matching (no oversubscription)
    omp_threads: 1            # default = threads_per_worker
    torch_threads: 1          # default = threads_per_worker
    dataloader_workers: 2
    cuda_alloc_fraction: 0.45 # per-process CUDA memory fraction in slots mode
  # B) search / scheduling
  sampler:
    kind: tpe                 # tpe | cmaes | random | gp | qmc
    multivariate: true        # TPE joint kernel (parameter interactions)
    constant_liar: true       # parallel workers do not chase in-flight points
  pruner:
    kind: hyperband           # hyperband (recommended) | successive_halving | median | none
    n_startup_trials: 5
    n_warmup_steps: 1
    min_resource: 1
    max_resource: auto        # Hyperband's largest resource ("auto" or epochs)
    reduction_factor: 3
  fidelity:
    enabled: false            # multi-fidelity (ASHA/Hyperband lever)
    dimension: epochs         # epochs | subset
    small: 1
    full: 8
    stages: 1
  multi_objective: false      # maximize dev_accuracy, minimize secondary
  multi_objective_secondary: epoch_time_s
  staged:
    enabled: false            # coarse-to-fine: head-only frozen-encoder warmup
    head_only_epochs: 0
  # C) exploit shared data
  shared_data:
    tokenized_cache: true     # pre-tokenize ONCE; all trials read the mmap
    embedding_cache: true     # frozen-encoder embeddings reused across trials
    dev_encoding_cache: true  # dev encodings cached for fast per-epoch eval
  warm_start:
    mode: base                # scratch | base | champion
    enqueue: []               # known-good param dicts -> study.enqueue_trial
  ensemble:
    enabled: false            # average the top-k trials (data is fixed)
    top_k: 3
    method: weights           # weights | predictions
  # D) Kaggle session limits
  session:
    timeout_s: 0              # 0 = no wall-clock timeout; else stop cleanly
    load_if_exists: true      # resume the shared study across sessions
    processes_only: true      # never study.optimize(n_jobs>1) threads
    offline: false            # true = single-process SQLite + offline ledger


# The Kaggle kernel the owner pushes (owner/slug). Distinct from the fine-tune
# kernel so an HPO push never clobbers a training push.
kernel_slug: fbarulli/er-laya-hpo

# The searchable dials. `type` selects the generic `trial.suggest_*` call:
#   int          -> suggest_int(name, lo, hi)
#   float        -> suggest_float(name, lo, hi, log=log)
#   categorical  -> suggest_categorical(name, choices)
dials:
  early_stop_patience:
    type: int
    target: control
    lo: 0
    hi: 6
  warmup_frac:
    type: float
    target: control
    lo: 0.0
    hi: 0.1
  lr_scheduler:
    type: categorical
    target: control
    choices: [cosine, linear, constant, onecycle, plateau]
  encoder_lr:
    type: float
    target: config
    lo: 1.0e-05
    hi: 1.0e-04
    log: true
  head_lr:
    type: float
    target: config
    lo: 1.0e-04
    hi: 1.0e-03
    log: true
  weight_decay:
    type: float
    target: config
    lo: 0.0
    hi: 0.1
  micro_batch:
    type: categorical
    target: config
    choices: [4, 8, 16]
  grad_accum:
    type: categorical
    target: config
    choices: [4, 8, 16]
  label_smoothing:
    type: float
    target: config
    lo: 0.0
    hi: 0.2
  sigma_start:
    type: float
    target: config
    lo: 0.0
    hi: 1.0
  sigma_end:
    type: float
    target: config
    lo: 0.0
    hi: 0.5
  ema:
    type: categorical
    target: control
    choices: [false, true]
  swa:
    type: categorical
    target: control
    choices: [false, true]
  layer_decay:
    type: float
    target: control
    lo: 0.5
    hi: 1.0
