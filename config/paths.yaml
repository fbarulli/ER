# ═══════════════════════════════════════════════════════════════════════════
# paths.yaml — the shared data contract (split-SSOT, 2026-09-13).
#
# This file holds ONLY what every lane shares: artifact paths, file names,
# the raw-export column mapping, the seed, the model registry, and the
# owned-layout templates for generated artifacts. Domain knobs live in their
# OWN dir, validated by a pydantic model in src/core/schemas.py at load time
# (fail-loud at import, never mid-run):
#
#   config/training.yaml  → TrainingConfig
#
# src/core/common.py is still the ONLY reader: it deep-merges these files into
# one view (load_config()) and validates each against its schema. No script
# reads YAML directly (unchanged SSOT doctrine).
#
# FILE BINDING FORMAT  "root:name"
# Every files./layouts. entry is bound to exactly ONE root and a name within
# it — the phone book owns the address, code owns only the resolution rule.
# Roots:
#   repo              → TRAIN_ROOT/name                     (repo root)
#   data              → DATA_DIR/name                       (data)
#   results           → RESULTS/name                        (honors
#                       EUROMONITOR_RESULTS_DIR — on a Colab worker this is
#                       the worker dir, NEVER the repo results root)
#   results_training  → RESULTS/training/name               (training family)
#   results_hpo       → RESULTS/hpo/name                    (hpo family)
# An unknown root crashes at import — no guessing, no fallback.
# ═══════════════════════════════════════════════════════════════════════════

# ── folder layout (relative to the repo root unless absolute) ──────────────
decision_attribute_aliases:
  # Masking's structured field -> the shared attribute-universe key.
  package_material: "pack material type"

paths:
  artifacts_dir: "artifacts"            # ONE root: everything lives under it
  # Versioned runtime data lives in this one repository-root directory.
  # A clean clone therefore has every non-model CSV needed by data prep,
  # training, and inference without relying on local artifact directories.
  data_dir: "data"
  results_dir: "results"                # frozen inputs + run-tree parent +
                                        # shared/orchestration outputs at repo root
  training_results_dir: "training_results" # verified Colab smoke outputs
  models_dir: "artifacts/models"        # Git-shipped production model bundle
  embeddings_dir: "artifacts/embeddings"  # step-1 full-corpus embedding dumps
  logs_dir: "logs"                      # per-step orchestrator logs
  # Machine-written audit findings. Tracked on purpose: this is the durable
  # evidence record for identity/gate adjudication, and the audit scripts read
  # each other's JSON here. Declared once so no script spells the path itself.
  audit_findings_dir: "identity/findings"
  # Training inputs share the versioned root-level data directory with the
  # reference data. Results remain separate and are never inputs by default.
  training_data_dir: "data"

# ── orchestration stage inventory (the trace-stage join SSOT) ───────────────
# The preparation orchestrator names its stages one way and each child writes
# trace rows under its own module's stage name, so a reader cannot join a
# stage's manifest entry to its rows without a hand map. This block IS that
# join: each KEY is an orchestration stage (in execution order) and each VALUE
# is the trace stage name(s) its producer writes rows under; an empty list
# marks a stage that writes NO trace rows today (a coverage gap, not a silent
# success). `orchestration_lane_stages` names the stages the orchestrator
# inserts only when a negative-supply run tag is requested.
#
# This block is the ONE home (config-SSOT audit 2026-10-08): core/tracing.py
# reads it through orchestration_trace_stages()/orchestration_lane_stages()
# (it holds no copy), and training.prepare_all derives its stage lists from the
# same accessors, so the plan, the trace join and this declaration can never
# drift apart.
orchestration_stages:
  dedupe: [dedupe]
  cross_country_pairs: [build_second04_pairs]
  number_reference: [number_reference]
  verify_reference: [verify_reference]
  canonical_and_gates: [data_prep]
  gate_census: []
  labeled_pairs: [labeled_pairs]
  negative_supply: [negative_supply]
  discriminator: []
  validation: [final_validation]
  graph_inputs: [graph_setup, graph_prepare]
  full_bundle: [full_bundle]
  suite_inputs: [suite_inputs]
  verify_handoff: [verify_handoff]
orchestration_lane_stages: [negative_supply, discriminator]

# ── artifact bindings (SSOT — nothing else in the tree spells these) ────────
files:
  decision_ledger: "repo:jev/sample_ledger.json"
  decision_rebuild_report: "repo:jev/full_evidence/report.json"
  decision_training_report: "repo:report.json"
  decision_suite_config: "repo:config/model_tracks.yaml"
  decision_embedding_request: "results:embedding_job/prepared_request.json"
  decision_visibility: "results:logs"
  decision_ablation_report: "results:attribute_ablation/report.json"
  decision_attribute_census: "results:attribute_universe_census.json"
  # The inspected raw export is repository-root dataset.csv. Keep this
  # explicit rather than silently falling back when artifacts/data is absent.
  dataset: "repo:dataset.csv"
  dataset_deduped: "training_data:dataset_deduped.csv"
  sku_to_rep: "data:sku_to_rep.csv"
  canonical_records: "training_data:canonical_records.csv"   # SHARED frozen input
  gate_results: "training_data:gate_results.csv"             # SHARED frozen input
  # Config files code reads by path: bound here so no module spells
  # config/<name> itself. ``identity_dimensions`` feeds the dimension policy
  # and the embedding/input identity hashes; declared once, read via F[name].
  identity_dimensions: "repo:config/identity_dimensions.yaml"
  # Frozen calibration pairs are an input to both training and inference,
  # so ship them with the rest of the versioned runtime data.
  labeled_pairs: "data:labeled_pairs.csv"
  # THE single validation population (P0). Folds 2+3 of the merged component
  # graph; replaces the retired dataset_deduped_sample_3000/5000 lanes, whose
  # splits were derived from a validation-blind graph and leaked (23.3% of
  # positives had both endpoints in train).
  final_validation: "training_data:final_validation.csv"
  # COMPLETE split accounting: every graph entity -> fold + component. The
  # validation CSV above holds only the scored half, so a consumer holding the
  # full labeled census needs this to tell "withheld, the model trained on it"
  # from "missing".
  validation_fold_map: "results_training:validation_fold_map.csv"
  embedding_similarities: "results_training:embedding_similarities.csv"
  model_evaluation_summary: "results_training:model_evaluation_summary.csv"
  attribute_separation_summary: "results_training:attribute_separation_summary.csv"
  attribute_separation_values: "results_training:attribute_separation_values.csv"
  fold_metrics: "results:train_fold_metrics.csv"       # worker-scoped pointer
  hpo_grid_csv: "results_hpo:hpo_grid.csv"
  # hpo_tpe_best REMOVED (audit round 2 F02, finished round 3): dead key —
  # F["hpo_tpe_best"] had zero readers. The TPE lane writes its best-config
  # JSON under a run-tagged name (train_<model><era>_hpo_best.json) built
  # inline in src/training/training.run_hpo, which prints the actual out_path.
  dedupe_summary: "results_training:dedupe_summary.csv"
  ambiguous_offer_groups: "results_training:ambiguous_offer_groups.csv"
  removals: "results_training:dedupe_removals.csv"
  dedupe_conflicts: "results_training:dedupe_conflicts.csv"
  four_pop_scores: "results_training:four_pop_scores.csv"
  field_ablation: "results_training:field_ablation.csv"
  data_scaling: "results_training:data_scaling.csv"
  data_quality_summary: "results_training:data_quality_summary.csv"
  data_quality_columns: "results_training:data_quality_columns.csv"
  data_quality_gtin_groups: "results_training:data_quality_gtin_groups.csv"
  title_attribute_evidence: "results_training:title_attribute_evidence.csv"
  title_attribute_summary: "results_training:title_attribute_summary.csv"
  title_removed_tokens: "results_training:title_removed_tokens.csv"
  attribute_agreement_summary: "results_training:attribute_agreement_summary.csv"
  attribute_agreement_conflicts: "results_training:attribute_agreement_conflicts.csv"
  package_gate_impact_summary: "results_training:package_gate_impact_summary.csv"
  package_gate_impact_pairs: "results_training:package_gate_impact_pairs.csv"
  # cache_dir REMOVED (audit 2026-09-09): dead knob — zero readers; the
  # embeddings cache path is constructed inline (DATA_DIR/embeddings_cache)
  # by its three consumers.
  number_reference: "data:number_tokens_reference.csv"
  # Generated by src/training/build_second04_pairs.py from the frozen
  # deduplicated dataset; consumed by src/core/volume_verified.
  second04_pairs_positive: "results_training:second04_pairs_positive.csv"
  results_pointer: "results:latest_results.json"  # the ONE file consumers read
  # to find the most recent FULL-run artifacts (run tag, metric CSVs, log dir);
  # src/training/train.py rewrites it on every non-sample run; sample runs never
  # touch it
  # The consolidated post-run training metric report (report_version 3). The
  # producer (training.generate_training_report) resolves BOTH the leaf name and
  # its default output directory from this binding, and the dashboard reads the
  # report back through the same key, so neither side spells "report.json" or a
  # results subpath itself.
  training_report: "results:report.json"
  # One fresh per-run Colab lane transcript (owner order 2026-10-07): the
  # system stdout/stderr tee, the trainer/worker view, and setup timing all
  # fold into this single file. Both legacy keys are kept for the tests and
  # any external reader, mapped to the same lane.log.
  colab_live_log: "repo:logs/colab/lane.log"      # the ONE lane transcript
  colab_training_log: "repo:logs/colab/lane.log"  # trainer view folds in

# ── owned layout templates for GENERATED artifacts (training-hpo 2026-09-13)
# Each layout binds a generated artifact to one root, one template, and one
# owning module.  Consumers render the destination via common.artifact() —
# placeholders are substituted ONLY from the declared fields; a missing field
# or an unknown layout crashes.  Nothing in the tree builds these paths by
# hand (no bare leaves, no "results/" literals, no glob conventions):
layouts:
  suite_package_shared:
    root: repo
    owner: model_tracks.package
    template: "data/model_tracks/shared"
    fields: {}
  suite_package_config:
    root: repo
    owner: model_tracks.package
    template: "data/model_tracks/suite.yaml"
    fields: {}
  # The standalone graph worker package's portable member root. The worker ZIP is
  # extracted into a checkout, so every member key is repository-relative and the
  # track name is a declared field (owner: graph_tracks.worker_package).
  graph_worker_package:
    root: repo
    owner: graph_tracks.worker_package
    template: "data/graph_worker/{track}"
    fields: {track: str}
  semantic_family_registry:
    root: repo
    owner: core.attribute_decision
    template: "artifacts/evidence/semantics/family_registry.json"
    fields: {}
  # The tracked measured-evidence census (owner: core.runtime_inputs): the
  # attribute-universe census the GPU lanes verify at runtime. NOTE:
  # files.decision_attribute_census is a DIFFERENT artifact — a results-tree
  # census the dashboard watches — and must not be confused with this one.
  attribute_universe_census:
    root: repo
    owner: core.runtime_inputs
    template: "artifacts/evidence/attribute_universe_census.json"
    fields: {}
  # The bundling pipeline's own source/config neighborhoods (one owner each,
  # declared once so no pipeline module spells a top-level directory name).
  source_code_dir:
    root: repo
    owner: training.prepare_all
    template: "src"
    fields: {}
  scripts_dir:
    root: repo
    owner: training.prepare_all
    template: "scripts"
    fields: {}
  config_dir:
    root: repo
    owner: training.prepare_all
    template: "config"
    fields: {}
  model_tracks_config:
    root: repo
    owner: training.prepare_all
    template: "config/model_tracks.yaml"
    fields: {}
  negative_supply_discriminator:
    root: repo
    owner: training.prepare_all
    template: "scripts/negative_supply_discriminator.py"
    fields: {}
  report_plot:
    root: results_training
    owner: training.report_plots
    template: "report_{kind}.png"
    fields: {kind: str}
  report_csv:
    root: results_training
    owner: training.report_plots
    template: "report_{kind}.csv"
    fields: {kind: str}
  final_inference:
    root: results
    owner: training.validation_inference
    template: "final_inference/{name}"
    fields: {name: str}
  hpo_trials:
    root: results_hpo
    owner: training.training
    template: "train_{model}{era}_hpo_trials.csv"
    fields: {model: str, era: str}
  hpo_best:
    root: results_hpo
    owner: training.training
    template: "train_{model}{era}_hpo_best.json"
    fields: {model: str, era: str}
  checkpoint_repo:
    root: results
    owner: training.training
    template: "_checkpoints/{model_tag}/r{run_tag}_f{fold}/checkpoint-{step}"
    fields: {model_tag: str, run_tag: str, fold: int, step: int}
  visibility:
    root: results
    owner: training.train
    template: "logs/{name}"
    fields: {name: str}
  visibility_run:
    root: results
    owner: training.train
    template: "logs/{run_tag}/{name}"
    fields: {run_tag: str, name: str}
  # The ONE consolidated pipeline trace (owner: core.tracing). Every stage of
  # data_prep and training appends its steps here instead of scattering them
  # across results/logs/*.csv. fields is deliberately EMPTY: the destination is
  # fixed, because a splittable trace is exactly what this layout prevents.
  training_trace:
    root: results
    owner: core.tracing
    template: "logs/training_trace.csv"
    fields: {}
  # The evaluation traceability document (owner: core.eval_trace): the per-slice
  # / per-attribute contract report for one lane and track. A SEPARATE artifact
  # on purpose — the frozen ablation report carries a .sha256 sidecar, so extra
  # keys on it are forbidden; this is the artifact that declares the shared
  # vocabulary. fields: one lane name + one track.
  traceability_report:
    root: results
    owner: core.eval_trace
    template: "logs/{lane}/{track}__traceability.json"
    fields: {lane: str, track: str}
  resume_pointer:
    root: results
    owner: training.dvc_store
    template: ".resume/{name}.dvc"
    fields: {name: str}
  dvc_publication_pointer:
    root: repo
    owner: training.dvc_store
    template: "dvc_refs/{run_id}/worker_{worker}/{pointer}"
    fields: {run_id: str, worker: int, pointer: str}
  dvc_publication_manifest:
    root: repo
    owner: training.dvc_store
    template: "dvc_refs/{run_id}/worker_{worker}/publication_manifest.json"
    fields: {run_id: str, worker: int}
  # Sample-balanced-pairs lane (training.sample_balanced_pairs) — the pool,
  # its fixed-size sample, the run manifest and the threshold sweep were
  # CWD-relative literals in the module; owned layouts instead.
  balanced_pairs:
    root: results_training
    owner: training.sample_balanced_pairs
    template: "balanced_pairs.csv"
    fields: {}
  balanced_pairs_sample:
    root: results_training
    owner: training.sample_balanced_pairs
    template: "balanced_pairs_sample_3000.csv"
    fields: {}
  balanced_pairs_sample_manifest:
    root: results_training
    owner: training.sample_balanced_pairs
    template: "balanced_pairs_sample_manifest.json"
    fields: {}
  balanced_pairs_sample_threshold_sweep:
    root: results_training
    owner: training.sample_balanced_pairs
    template: "balanced_pairs_sample_threshold_sweep.csv"
    fields: {}
  # ── suite run outputs (one downloaded/produced suite run) ──────────────────
  # The suite output tree, its sealed archive and the per-track ablation report
  # were addressed by bare "results/model_tracks/<run_tag>" literals in the
  # dashboard's comparison surface. Declared here so the address has one owner
  # and the phone book resolves it (no bare leaves outside this file).
  suite_outputs:
    root: results
    owner: model_tracks.run
    template: "model_tracks/{run_tag}"
    fields: {run_tag: str}
  suite_output_archive:
    root: results
    owner: model_tracks.run
    template: "model_tracks/{run_tag}.{fmt}"
    fields: {run_tag: str, fmt: str}
  suite_output_input_archive:
    root: results
    owner: model_tracks.package
    template: "model_tracks/{run_tag}__inputs.{fmt}"
    fields: {run_tag: str, fmt: str}
  suite_output_training_archive:
    root: results
    owner: model_tracks.run
    template: "model_tracks/{run_tag}.training.{fmt}"
    fields: {run_tag: str, fmt: str}
  # The local completion's restored prepared-input tree: the package members
  # land under this root so nothing rewrites data/ in place.
  suite_output_local_inputs:
    root: results
    owner: model_tracks.local_complete
    template: "model_tracks/{run_tag}/local_inputs"
    fields: {run_tag: str}
  # One track's frozen-checkpoint ablation report inside a suite run.
  track_ablation_report:
    root: results
    owner: model_tracks.post_training_ablation
    template: "model_tracks/{run_tag}/{track}/ablation/report.json"
    fields: {run_tag: str, track: str}
  track_ablation_vectors:
    root: results
    owner: model_tracks.staged_ablation
    template: "model_tracks/{run_tag}/{track}/ablation/vectors.npz"
    fields: {run_tag: str, track: str}
  # The dashboard's rendered side-by-side comparison for one run.
  model_comparison_plot:
    root: results
    owner: dashboard.model_comparison
    template: "model_tracks/{run_tag}/model_comparison/{name}"
    fields: {run_tag: str, name: str}
  # The project dataset's two declared TREE roots (owner: core.dataset). Bound
  # here, not spelled in code, so ``core.dataset`` resolves them through the
  # same phone book every other generated artifact uses (common.artifact()).
  # ``dataset_prepared`` holds the sealed prepared-input bundles the dataset
  # derives (prepared/*); ``dataset_track_setup`` holds the graph-track setup
  # inputs derived from the same catalog (track_setup/*).
  dataset_prepared:
    root: repo
    owner: core.dataset
    template: "data/prepared"
    fields: {}
  dataset_track_setup:
    root: repo
    owner: core.dataset
    template: "data/track_setup"
    fields: {}

# ── raw-export column mapping (applied by load_dataset; CSV never modified) ─
# SSOT for EVERY column name in the project (owner ruling 2026-10-01).
# Read once by core.columns, which derives:
#   * RAW_EXPORT_COLUMNS / CANONICAL_COLUMNS / COLUMN_MAPPING
#   * SOURCE_ROW_FIELDS   — which columns the per-title original-evidence
#                           capture (canonical_records.source_rows) retains
#   * every required-column contract downstream of it
# Code must NOT hardcode a column-name tuple. A literal list is a second
# declaration that cannot be steered by this file and drifts silently — the
# same class of defect as the volume tolerance (five lanes each declaring one
# tolerance) and the stage-7 re-parse (a mechanism reading column names that
# no caller supplied).
# Preserve pandas' existing string/NA parsing across all dataset loaders.
dataset_csv_read:
  dtype: str
  keep_default_na: true
  na_filter: true

# Plausibility is per physical package, not multiplied by pack count.
# A named bulk container can be larger; conflicting sources still need review.
extraction:
  volume_min_ml: 1.0
  volume_max_ml: 10000.0
  bulk_volume_max_ml: 25000.0
  title_attribute_override_ratio: 10.0
  bulk_container_terms: [bucket, barrel, drum, carboy, jerry can]
  source_groups:
    attribute: declared_attributes
    sku_name_eng: listing_text
    sku_url: listing_text
    image_url: listing_text
    description_short_eng: listing_text
  pack_confidence:
    nested: 0.95
    multiplier: 0.90
    pack_of: 0.90
    count: 0.85
    compact: 0.75
    container: 0.90
    attribute: 0.90

# Completeness scores use product descriptors; all other mapped columns are
# excluded. Order preserves the existing product-identity metadata contract.
descriptor_columns:
  - sku_name_eng
  - brand
  - category
  - breadcrumbs_eng
  - attribute
  - description_short_eng

