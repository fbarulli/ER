# ═══════════════════════════════════════════════════════════════════════════
# paths.yaml — the shared data contract (split-SSOT, 2026-09-13).
#
# This file holds ONLY what every lane shares: artifact paths, file names,
# the raw-export column mapping, the seed, the model registry, and the
# owned-layout templates for generated artifacts. Domain knobs live in their
# OWN dir, validated by a pydantic model in src/core/schemas.py at load time
# (fail-loud at import, never mid-run):
#
#   config/training.yaml  → TrainingConfig
#
# src/core/common.py is still the ONLY reader: it deep-merges these files into
# one view (load_config()) and validates each against its schema. No script
# reads YAML directly (unchanged SSOT doctrine).
#
# FILE BINDING FORMAT  "root:name"
# Every files./layouts. entry is bound to exactly ONE root and a name within
# it — the phone book owns the address, code owns only the resolution rule.
# Roots:
#   repo              → TRAIN_ROOT/name                     (repo root)
#   data              → DATA_DIR/name                       (data)
#   results           → RESULTS/name                        (honors
#                       EUROMONITOR_RESULTS_DIR — on a Colab worker this is
#                       the worker dir, NEVER the repo results root)
#   results_training  → RESULTS/training/name               (training family)
#   results_hpo       → RESULTS/hpo/name                    (hpo family)
# An unknown root crashes at import — no guessing, no fallback.
# ═══════════════════════════════════════════════════════════════════════════

# ── folder layout (relative to the repo root unless absolute) ──────────────
paths:
  artifacts_dir: "artifacts"            # ONE root: everything lives under it
  # Versioned runtime data lives in this one repository-root directory.
  # A clean clone therefore has every non-model CSV needed by data prep,
  # training, and inference without relying on local artifact directories.
  data_dir: "data"
  results_dir: "results"                # frozen inputs + run-tree parent +
                                        # shared/orchestration outputs at repo root
  training_results_dir: "training_results" # verified Colab smoke outputs
  models_dir: "artifacts/models"        # Git-shipped production model bundle
  embeddings_dir: "artifacts/embeddings"  # step-1 full-corpus embedding dumps
  mlruns_dir: "artifacts/mlruns"        # mlflow backend + artifact store (local)
  logs_dir: "logs"                      # per-step orchestrator logs
  # Training inputs share the versioned root-level data directory with the
  # reference data. Results remain separate and are never inputs by default.
  training_data_dir: "data"

# ── artifact bindings (SSOT — nothing else in the tree spells these) ────────
files:
  # The inspected raw export is repository-root dataset.csv. Keep this
  # explicit rather than silently falling back when artifacts/data is absent.
  dataset: "repo:dataset.csv"
  dataset_deduped: "training_data:dataset_deduped.csv"
  dataset_deduped_sample_3000: "training_data:dataset_deduped_sample_3000.csv"
  dataset_deduped_train_minus_3000: "training_data:dataset_deduped_train_minus_3000.csv"
  sku_to_rep: "data:sku_to_rep.csv"
  canonical_records: "training_data:canonical_records.csv"   # SHARED frozen input
  gate_results: "training_data:gate_results.csv"             # SHARED frozen input
  labeled_pairs: "results_training:labeled_pairs.csv"
  balanced_pairs_sample_3000: "results_training:balanced_pairs_sample_3000.csv"
  embedding_similarities: "results_training:embedding_similarities.csv"
  model_evaluation_summary: "results_training:model_evaluation_summary.csv"
  attribute_separation_summary: "results_training:attribute_separation_summary.csv"
  attribute_separation_values: "results_training:attribute_separation_values.csv"
  fold_metrics: "results:train_fold_metrics.csv"       # worker-scoped pointer
  hpo_grid_csv: "results_hpo:hpo_grid.csv"
  # hpo_tpe_best REMOVED (audit round 2 F02, finished round 3): dead key —
  # F["hpo_tpe_best"] had zero readers. The TPE lane writes its best-config
  # JSON under a run-tagged name (train_<model><era>_hpo_best.json) built
  # inline in src/training/training.run_hpo, which prints the actual out_path.
  dedupe_summary: "results_training:dedupe_summary.csv"
  ambiguous_offer_groups: "results_training:ambiguous_offer_groups.csv"
  removals: "results_training:dedupe_removals.csv"
  four_pop_scores: "results_training:four_pop_scores.csv"
  field_ablation: "results_training:field_ablation.csv"
  data_scaling: "results_training:data_scaling.csv"
  data_quality_summary: "results_training:data_quality_summary.csv"
  data_quality_columns: "results_training:data_quality_columns.csv"
  data_quality_gtin_groups: "results_training:data_quality_gtin_groups.csv"
  title_attribute_evidence: "results_training:title_attribute_evidence.csv"
  title_attribute_summary: "results_training:title_attribute_summary.csv"
  title_removed_tokens: "results_training:title_removed_tokens.csv"
  attribute_agreement_summary: "results_training:attribute_agreement_summary.csv"
  attribute_agreement_conflicts: "results_training:attribute_agreement_conflicts.csv"
  package_gate_impact_summary: "results_training:package_gate_impact_summary.csv"
  package_gate_impact_pairs: "results_training:package_gate_impact_pairs.csv"
  # cache_dir REMOVED (audit 2026-09-09): dead knob — zero readers; the
  # embeddings cache path is constructed inline (DATA_DIR/embeddings_cache)
  # by its three consumers.
  number_reference: "data:number_tokens_reference.csv"
  # Generated by src/training/build_second04_pairs.py from the frozen
  # deduplicated dataset; consumed by src/core/volume_verified.
  second04_pairs_positive: "results_training:second04_pairs_positive.csv"
  results_pointer: "results:latest_results.json"  # the ONE file consumers read
  # to find the most recent FULL-run artifacts (run tag, metric CSVs, log dir);
  # src/training/train.py rewrites it on every non-sample run; sample runs never
  # touch it
  colab_live_log: "repo:colab_system.log"      # launcher/system log
  colab_training_log: "repo:training.log"      # training stdout/stderr only

# ── owned layout templates for GENERATED artifacts (training-hpo 2026-09-13)
# Each layout binds a generated artifact to one root, one template, and one
# owning module.  Consumers render the destination via common.artifact() —
# placeholders are substituted ONLY from the declared fields; a missing field
# or an unknown layout crashes.  Nothing in the tree builds these paths by
# hand (no bare leaves, no "results/" literals, no glob conventions):
layouts:
  report_plot:
    root: results_training
    owner: training.report_plots
    template: "report_{kind}.png"
    fields: {kind: str}
  report_csv:
    root: results_training
    owner: training.report_plots
    template: "report_{kind}.csv"
    fields: {kind: str}
  final_inference:
    root: results
    owner: training.validation_inference
    template: "final_inference/{name}"
    fields: {name: str}
  hpo_trials:
    root: results_hpo
    owner: training.training
    template: "train_{model}{era}_hpo_trials.csv"
    fields: {model: str, era: str}
  hpo_best:
    root: results_hpo
    owner: training.training
    template: "train_{model}{era}_hpo_best.json"
    fields: {model: str, era: str}
  checkpoint_repo:
    root: results
    owner: training.training
    template: "_checkpoints/{model_tag}/r{run_tag}_f{fold}/checkpoint-{step}"
    fields: {model_tag: str, run_tag: str, fold: int, step: int}
  visibility:
    root: results
    owner: training.train
    template: "logs/{name}"
    fields: {name: str}
  visibility_run:
    root: results
    owner: training.train
    template: "logs/{run_tag}/{name}"
    fields: {run_tag: str, name: str}
  # The ONE consolidated pipeline trace (owner: core.tracing). Every stage of
  # data_prep and training appends its steps here instead of scattering them
  # across results/logs/*.csv. fields is deliberately EMPTY: the destination is
  # fixed, because a splittable trace is exactly what this layout prevents.
  training_trace:
    root: results
    owner: core.tracing
    template: "logs/training_trace.csv"
    fields: {}
  resume_pointer:
    root: results
    owner: training.dvc_store
    template: ".resume/{name}.dvc"
    fields: {name: str}
  dvc_publication_pointer:
    root: repo
    owner: training.dvc_store
    template: "dvc_refs/{run_id}/worker_{worker}/{pointer}"
    fields: {run_id: str, worker: int, pointer: str}
  dvc_publication_manifest:
    root: repo
    owner: training.dvc_store
    template: "dvc_refs/{run_id}/worker_{worker}/publication_manifest.json"
    fields: {run_id: str, worker: int}

# ── raw-export column mapping (applied by load_dataset; CSV never modified) ─
column_mapping:
  sku_id: product_id
  retailer: retailer
  country: country
  sku_name_eng: title
  description_short_eng: description
  breadcrumbs_eng: category_path
  sku_url: url
  image_url: image_url
  sku_last_price: price
  gtin: barcode
  brand: brand
  category: category
  attribute: attributes

# ── seed (whole tree uses this one value) ───────────────────────────────────
seed: 42

# ── model registry (shared by every model-loading lane) ─────────────────────
# Values are relative directories inside the configured model roots. The
# production bundle is shipped in paths.models_dir with the repository;
# values are never Hub IDs.
models:
  minilm_l6: "all-MiniLM-L6-v2"
  multilingual_l12: "paraphrase-multilingual-MiniLM-L12-v2"
  deberta_v3_base: "deberta-v3-base"
  rerank_minilm_l6: "ms-marco-MiniLM-L-6-v2"
  ner_semantic_base: "paraphrase-multilingual-mpnet-base-v2"
  ner_transformer_base: "xlm-roberta-base"

# Bi-encoder bundles consumed by embedding/similarity/report lanes. The model
# registry also contains cross-encoder and NER bundles; those are not valid
# inputs to SentenceTransformer.encode and must never be iterated as encoders.
embedding_model_keys:
  - minilm_l6
  - multilingual_l12
  - deberta_v3_base
