# Standalone graph worker: W&B offline + local DVC by default; no MLflow.
track: hybrid
listings: data/graph_tracks/listings.json
pairs: data/graph_tracks/pairs.csv
text_cache: data/graph_tracks/shared_minilm__embeddings.npz
output_dir: results/graph_tracks
hidden_dim: 64
output_dim: 128
epochs: 10
learning_rate: 0.001
weight_decay: 0.0001
# Select GPU kernels without changing the standalone CPU execution path.
optimizer_backend: cuda_fused
aggregation_backend: cuda_segment
early_stopping_patience: 3
early_stopping_threshold: 0.001
lr_scheduler: plateau
lr_patience: 1
lr_factor: 0.5
min_lr: 0.00001
seed: 1337
device: cpu
graph_enabled: true
metric_weight: 1.0
negative_margin: 0.3
max_grad_norm: 1.0
input_manifest: data/graph_tracks/input_manifest.json
wandb:
  project: e-r
  mode: offline
dvc:
  enabled: false
  remote: null
  push: false
postprocess: true
report_test: true
build_index: true
inference_batch_size: 1024
# retrieval_ks defaults to evaluation.ann_recall_ks in training.yaml.
# Declare it here only for an intentional lane-specific override.
hnsw_m: 16
hnsw_ef_construction: 200
hnsw_ef_search: 100
