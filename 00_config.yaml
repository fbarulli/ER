# ═══════════════════════════════════════════════════════════════════════════
# 00_config.yaml — the SHARED DATA contract (split-SSOT, 2026-09-08).
#
# This file holds ONLY what every lane shares: artifact paths, file names,
# the raw-export column mapping, the seed, and the model registry.
# Domain knobs live in their OWN dir, validated by a pydantic model
# in lib/schemas.py at load time (fail-loud at import, never mid-run):
#
#   TRAIN/training.yaml  → TrainingConfig  (loss/split/masking/bands/pairs/
#                        plots/audit — absorbed the EDA config keys when
#                        the EDA dir was deleted 2026-09-10)
#
# lib/common.py is still the ONLY reader: it deep-merges these files into
# one view (load_config()) and validates each against its schema. No script
# reads YAML directly (unchanged SSOT doctrine).
# ═══════════════════════════════════════════════════════════════════════════

# ── folder layout (relative to the repo root unless absolute) ──────────────
# ALL data, results, model tensors and embeddings live under artifacts/ —
# one place at the root of the lane.
paths:
  artifacts_dir: "artifacts"            # ONE root: everything lives under it
  data_dir: "artifacts/data"            # raw + deduped dataset live here
  results_dir: "results"                # ALL generated outputs at repository root
  models_dir: "artifacts/models"        # local model tensors (bundle)
  models_dir_sibling: "../models"       # bundle layout: models/ beside folder
  embeddings_dir: "artifacts/embeddings"  # step-1 full-corpus embedding dumps
  mlruns_dir: "artifacts/mlruns"          # mlflow backend + artifact store (local)
  logs_dir: "logs"                      # run_all per-step logs

# ── file names (SSOT — nothing else in the tree spells these) ───────────────
# stopwords = data_pipe's word lists (STOPWORDS / MINIMAL_STOPWORDS /
#   CONCEPT_FOLDS), living in lib/ beside the pipeline code.
# sklearn_stopwords = lib/matching.py's frozen sklearn ENGLISH_STOP_WORDS
#   (n=318). Two lists, two files — renamed 2026-09-08 so they stop sharing
#   a basename, each resolved relative to lib/.
files:
  # The inspected raw export is repository-root dataset.csv.  Keep this
  # explicit rather than silently falling back when artifacts/data is absent.
  dataset: "../../dataset.csv"
  dataset_deduped: "dataset_deduped.csv"
  sku_to_rep: "sku_to_rep.csv"
  canonical_records: "canonical_records.csv"
  gate_results: "gate_results.csv"
  labeled_pairs: "labeled_pairs.csv"
  embedding_similarities: "embedding_similarities.csv"
  model_evaluation_summary: "model_evaluation_summary.csv"
  fold_metrics: "train_fold_metrics.csv"
  hpo_grid_csv: "hpo_grid.csv"
  # hpo_tpe_best REMOVED (audit round 2 F02, finished round 3): dead key —
  # F["hpo_tpe_best"] had zero readers. The TPE lane writes its best-config
  # JSON under a run-tagged name (train_<model><era>_hpo_best.json) built
  # inline in TRAIN/training.run_hpo, which prints the actual out_path.
  dedupe_summary: "06_dedupe_summary.csv"
  ambiguous_offer_groups: "06_ambiguous_offer_groups.csv"
  removals: "06_dedupe_removals.csv"
  four_pop_scores: "07b_four_pop_scores.csv"
  field_ablation: "07c_field_ablation.csv"
  data_scaling: "07d_data_scaling.csv"
  data_quality_summary: "data_quality_summary.csv"
  data_quality_columns: "data_quality_columns.csv"
  data_quality_gtin_groups: "data_quality_gtin_groups.csv"
  title_attribute_evidence: "title_attribute_evidence.csv"
  title_attribute_summary: "title_attribute_summary.csv"
  title_removed_tokens: "title_removed_tokens.csv"
  attribute_agreement_summary: "attribute_agreement_summary.csv"
  attribute_agreement_conflicts: "attribute_agreement_conflicts.csv"
  package_gate_impact_summary: "package_gate_impact_summary.csv"
  package_gate_impact_pairs: "package_gate_impact_pairs.csv"
  # cache_dir REMOVED (audit 2026-09-09): dead knob — zero readers; the
  # embeddings cache path is constructed inline (DATA_DIR/embeddings_cache)
  # by its three consumers.
  stopwords: "pipe_stopwords.json"          # lib/ (data_pipe word lists)
  sklearn_stopwords: "sklearn_stopwords.json"  # lib/ (matching.py TF-IDF list)
  number_reference: "number_tokens_reference.csv"
  # second04_pairs_positive (audit round 2 F13): the repo-side cross-country
  # gold-pair manifest read by lib/volume_verified — ABSENT in this lane
  # (the loader prints a loud notice and runs gate-only). Declared here so
  # the name is SSOT-side, not an inline literal.
  second04_pairs_positive: "second04_pairs_positive.csv"
  results_pointer: "latest_results.json"  # the ONE file consumers read to
  # find the most recent FULL-run artifacts (run tag, metric CSVs, log dir);
  # TRAIN/train.py rewrites it on every non-sample run; sample runs never
  # touch it

# ── raw-export column mapping (applied by load_dataset; CSV never modified) ─
column_mapping:
  sku_id: product_id
  retailer: retailer
  country: country
  sku_name_eng: title
  description_short_eng: description
  breadcrumbs_eng: category_path
  sku_url: url
  image_url: image_url
  sku_last_price: price
  gtin: barcode
  brand: brand
  category: category
  attribute: attributes

# ── seed (whole tree uses this one value) ───────────────────────────────────
seed: 42

# ── category -> macro bucket taxonomy (SSOT move, this round) ───────────────
# Domain data, not code: the blocking layer rolls the dataset's 24 strict
# categories up to coarse macro buckets (recall-first — retailers
# categorize the same product consistently ~94% at the strict level, so
# blocking matches at macro to avoid rejecting true matches; scoring still
# uses the strict category, higher mutual information). Was the inline
# MACRO_MAP dict in lib/text.py; a taxonomy the owner may tune belongs
# under config control, not in code. Read via lib.common.category_macros().
category_macros:
  "Not from Concentrate 100% Juice": JUICE
  "Reconstituted 100% Juice": JUICE
  "Juice Drinks (up to 24% Juice)": JUICE
  "Nectars": JUICE
  "Coconut and Other Plant Waters": JUICE
  "Other Non-Cola Carbonates": CARBONATES
  "Orange Carbonates": CARBONATES
  "Regular Cola Carbonates": CARBONATES
  "Reduced Sugar Cola Carbonates": CARBONATES
  "Tonic Water/Mixers/Other Bitters": CARBONATES
  "Lemonade/Lime": CARBONATES
  "Energy Drinks": ENERGY_SPORTS
  "Sports Drinks": ENERGY_SPORTS
  "Still Bottled Water": WATER
  "Carbonated Bottled Water": WATER
  "Sparkling Flavoured Bottled Water": WATER
  "Still Flavoured Bottled Water": WATER
  "Functional Bottled Water": WATER
  "Still RTD Tea": TEA_COFFEE
  "Carbonated RTD Tea and Kombucha": TEA_COFFEE
  "RTD Coffee": TEA_COFFEE
  "Asian Speciality Drinks": TEA_COFFEE
  "Liquid Concentrates": CONCENTRATES
  "Powder Concentrates": CONCENTRATES

# ── model registry (shared: TRAIN lane + run_all all resolve
#    through lib.common.resolve_model — local bundle dir first, hub id as
#    fallback; no script may hardcode a model string) ────────────────────────
models:
  minilm_l6: "all-MiniLM-L6-v2"
  multilingual_l12: "paraphrase-multilingual-MiniLM-L12-v2"   # trainer base
  deberta_v3_base: "deberta-v3-base"
