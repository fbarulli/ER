# ═══════════════════════════════════════════════════════════════════════════
# TRAIN_GPU — THE single source of truth (SSOT).
# Every path, file name, and knob lives HERE. No file hardcodes any of them;
# all files load values via lib/common.load_config() ONLY.
# ═══════════════════════════════════════════════════════════════════════════

# ── folder layout (relative to TRAIN_GPU/ unless absolute) ──────────────────
# ALL data, results, model tensors and embeddings live under artifacts/ —
# one place at the root of the lane.
paths:
  artifacts_dir: "artifacts"            # ONE root: everything lives under it
  data_dir: "artifacts/data"            # raw + deduped dataset live here
  results_dir: "artifacts/results"      # ALL outputs (CSVs, PNGs, checkpoints)
  models_dir: "artifacts/models"        # local model tensors (bundle)
  models_dir_sibling: "../models"       # bundle layout: models/ beside folder
  embeddings_dir: "artifacts/embeddings"  # step-1 full-corpus embedding dumps
  mlruns_dir: "artifacts/mlruns"          # mlflow backend + artifact store (local)
  logs_dir: "logs"                      # run_all per-step logs

# ── file names (SSOT — nothing else in the tree spells these) ─────────────────
files:
  dataset: "dataset.csv"
  dataset_deduped: "dataset_deduped.csv"
  canonical_records: "canonical_records.csv"
  gate_results: "gate_results.csv"
  labeled_pairs: "labeled_pairs.csv"
  embedding_similarities: "embedding_similarities.csv"
  model_evaluation_summary: "model_evaluation_summary.csv"
  fold_metrics: "train_fold_metrics.csv"
  hpo_grid_csv: "hpo_grid.csv"
  hpo_tpe_best: "hpo_tpe_best.json"
  cache_dir: "cache_v2"
  stopwords: "stopwords.json"
  number_reference: "number_tokens_reference.csv"
  clean_sku_gtin: "clean_sku_gtin.csv"

# ── raw-export column mapping (applied by load_dataset; CSV never modified) ─
column_mapping:
  sku_id: product_id
  retailer: retailer
  country: country
  sku_name_eng: title
  description_short_eng: description
  breadcrumbs_eng: category_path
  sku_url: url
  image_url: image_url
  sku_last_price: price
  gtin: barcode
  brand: brand
  category: category
  attribute: attributes

# ── seed (whole tree uses this one value) ───────────────────────────────────
seed: 42

# ── models ───────────────────────────────────────────────────────────────────
models:
  minilm_l6: "all-MiniLM-L6-v2"
  multilingual_l12: "paraphrase-multilingual-MiniLM-L12-v2"   # trainer base
  deberta_v3_base: "deberta-v3-base"

# similarity column names 
sim_columns:
  minilm_l6: "sim_minilm_l6"
  multilingual_l12: "sim_multilingual_l12"
  deberta_v3_base: "sim_deberta_v3_base"

# ── masking augmentation 
masking:
  enabled: true
  frac: 1.00          # fraction of positive anchors masked when enabled
  mask_prob: null     # null: per-pair extent drawn from mask_lo..mask_hi
  mask_lo: 0.05       # variable extent band (owner spec: 5-15%)
  mask_hi: 0.15

# ── split (component-aware; no pair ever straddles a boundary) ──────────────
split:
  mode: "holdout"      # holdout = train 50% / dev 25% / test 25%
  # ── the three sets (component-aware: no barcode straddles any boundary) ──
  # train  = 50% of connected components — the ONLY data the model trains on
  # dev    = 25% — early-stopping target; weights are picked here, never trained on
  # test   = 25% — HOLDOUT: the model NEVER trains on it, directly or via
  #          early stopping. Every reported test metric (AUC, PR-AUC, F1)
  #          comes from this set and nothing else.
  train_fraction: 0.50
  dev_fraction: 0.25    # carved OUT OF THE TRAIN SIDE in cv mode; in holdout
                       # mode it is the q2 component quarter (q0+q1=train)
  test_fraction: 0.25
  fixed_threshold: 0.55  # the lane's operating cosine threshold (F1/P/R reported here)
  cv_folds: 5         # cv mode only

# ── training ─────────────────────────────────────────────────────────────────
training:
  epochs: 3
  lr: 0.00002
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler: "linear"
  max_grad_norm: 1.0
  es_patience: 3
  es_threshold: 0.001

# ── pair-selection thresholds (owner's label semantics) ──────────────────────
pairs:
  proceed_sim_threshold: 0.80    # positives: proceed & sim>=0.80
  hardneg_sim_threshold: 0.80    # hard negatives: hard_no & sim>=0.80

# ── mining band for in-batch negatives ───────────────────────────────────────
mining:
  band: "0.45-0.80"
  n_target: 20000
